<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCR Live</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#111827;color:#fff;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#1f2937;border:1px solid #374151;border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 12px 30px #0005}h1{font-size:40px;margin:8px 0}h1 span{color:#fbbf24}input,button{width:100%;padding:14px;border-radius:12px;border:0;font-size:17px;margin:6px 0}input{background:#fff;color:#111}button{background:#fbbf24;font-weight:800;cursor:pointer}button.secondary{background:#374151;color:#fff}.hide{display:none}.room{font-size:30px;letter-spacing:5px;color:#fbbf24}.players{display:grid;gap:8px}.p{padding:12px 14px;background:#111827;border-radius:12px;display:flex;justify-content:space-between}.active{outline:2px solid #fbbf24}.dice{font-size:44px;display:flex;gap:12px;justify-content:center;margin:14px}.center{text-align:center;font-size:22px}.small{opacity:.75;font-size:14px}.winner{text-align:center;font-size:32px;color:#fbbf24;font-weight:900}</style></head><body><div class="wrap"><h1>🎲 <span>LCR</span> LIVE</h1><div id="home" class="card"><input id="name" placeholder="Your name" maxlength="20"><button id="create">Create Game</button><div style="text-align:center">or</div><input id="code" placeholder="Room code" maxlength="4"><button class="secondary" id="join">Join Game</button><div id="err"></div></div><div id="game" class="hide"><div class="card"><div class="small">ROOM CODE — share this with your players</div><div class="room" id="room"></div><div id="status"></div></div><div class="card"><div class="center">🏦 Center Pot: <b id="center">0</b></div><div id="dice" class="dice"></div><button id="roll" class="hide">ROLL DICE 🎲</button><button id="start" class="hide">START GAME</button><button id="restart" class="hide secondary">NEW GAME</button></div><div class="card"><h2>Players</h2><div class="players" id="players"></div></div></div></div><script src="/socket.io/socket.io.js"></script><script>const s=io();let room=null,me=null,state=null;const $=x=>document.getElementById(x);function enter(c){room=c;me=s.id;$('home').classList.add('hide');$('game').classList.remove('hide');$('room').textContent=c}function act(type){const name=$('name').value.trim();if(!name)return $('err').textContent='Enter your name first.';s.emit(type,{name,code:$('code').value.trim()},r=>r.ok?enter(r.code):$('err').textContent=r.msg)}$('create').onclick=()=>act('create');$('join').onclick=()=>act('join');$('start').onclick=()=>s.emit('start',room);$('roll').onclick=()=>s.emit('roll',room);$('restart').onclick=()=>s.emit('restart',room);s.on('state',r=>{state=r;render()});function render(){if(!state)return;$('center').textContent=state.center;$('players').innerHTML=state.players.map((p,i)=>`<div class="p ${state.started&&!state.winner&&i===state.turn?'active':''}"><span>${p.id===me?'👉 ':''}${p.name}</span><b>🪙 ${p.chips}</b></div>`).join('');const mine=state.players.find(p=>p.id===me),host=state.players[0]?.id===me;$('start').classList.toggle('hide',state.started||!host||state.players.length<2);$('restart').classList.toggle('hide',!state.winner||!host);$('roll').classList.toggle('hide',!state.started||!!state.winner||state.players[state.turn]?.id!==me||!mine?.chips);if(state.winner){const w=state.players.find(p=>p.id===state.winner);$('status').innerHTML=`<div class="winner">🏆 ${w?.name} WINS!</div>`}else if(!state.started)$('status').textContent=`Waiting for players… ${state.players.length} joined`;else $('status').textContent=`${state.players[state.turn].name}'s turn`;if(state.last)$('dice').innerHTML=state.last.rolls.map(x=>`<span>${x==='•'?'●':x}</span>`).join('');else $('dice').innerHTML='';}</script></body></html>
